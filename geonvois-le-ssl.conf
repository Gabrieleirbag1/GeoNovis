<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin missclick@geonovis
    ServerName geonovis.missclick.net

    DocumentRoot /var/www/GeoNovis/browser

    ErrorLog ${APACHE_LOG_DIR}/missclick-error.log
    CustomLog ${APACHE_LOG_DIR}/missclick-access.log combined

    <Directory /var/www/GeoNovis/browser>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Location "/api">
        ProxyPass "http://localhost:3111/api"
        ProxyPassReverse "http://localhost:3111/api"
    </Location>


SSLCertificateFile /etc/letsencrypt/live/geonovis.missclick.net/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/geonovis.missclick.net/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
