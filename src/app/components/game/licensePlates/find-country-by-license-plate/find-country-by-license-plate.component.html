<section>
  <div class="country-name">
    <img [src]="assetsService.getPlateImage(selectedPlate)" class="plate-image">
  </div>
  <div class="qcm qcm-plate" *ngIf="countries.length > 0">
    <button class="answer-btn"*ngFor="let country of countries" (click)="onAnswerSelect(country)" name="{{ country.code }}">
      {{ country.name }}
    </button>
  </div>
</section>
