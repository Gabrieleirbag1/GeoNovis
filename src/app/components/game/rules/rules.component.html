<section class="rules-container">
    <div class="section-title">{{ language === "fr" ? "Zone(s) géographique(s)" : "Geographical Area(s)" }}</div>
    <div class="map-image-container">
        <img *ngFor="let region of regions" src="/images/maps/map-{{region}}.png">
    </div>
    <div class="section-title">{{ language === "fr" ? "Limite de Temps" : "Time Limit" }}</div>
    <div class="timelimit-section">
        <select id="timelimit" class="timelimit" [(ngModel)]="gameInfos.timeLimit.default">
        <option value={{gameInfos.timeLimit.default}} *ngFor="let time of gameInfos.timeLimit.values" [value]="time">
            <span>{{ time }}</span>
            <span *ngIf="typeof time === 'number'">s</span>
        </option>
        </select>
    </div>
    <div class="section-title">{{ language === "fr" ? "Nombre de Tours" : "Number of Rounds" }}</div>
    <div class="rounds-section">
        <select id="rounds" class="rounds">
        <option *ngFor="let round of gameInfos.rounds.values" [value]="round"
               [selected]="round === gameInfos.rounds.default">
            <span>{{ round }}</span>
        </option>
        </select>
    </div>
    <div class="start-game">
        <button (click)="startGame()">{{ language === "fr" ? "Lancer la partie" : "Start Game" }}</button>
    </div>
    
    <!-- Warning Modal -->
    <div class="modal-overlay" *ngIf="showWarningModal">
        <div class="modal-content">
            <h3>Warning!</h3>
            <p>{{ warningMessage }}</p>
            <div class="modal-buttons">
                <button (click)="confirmStartNewGame()">Continue</button>
                <button (click)="cancelStartNewGame()">Cancel</button>
            </div>
        </div>
    </div>
</section>
