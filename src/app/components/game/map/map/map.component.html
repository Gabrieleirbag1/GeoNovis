<section>
  <div class="country-name">
    @if (selectedCountry) {
      <span>
      {{ selectedCountry }}
      </span>
    } @else {
      <span>
      {{ language === 'fr' ? 'Chargement de la carte...' : 'Loading the map...' }}
      </span>
    }
  </div>
  <div class="map-container">
    <div class="map-frame">
      <div id="map"></div>
    </div>
  </div>
</section>
