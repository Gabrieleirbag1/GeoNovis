<section>
  <div class="country-name">
    {{ selectedCountry }}
  </div>
  <div class="qcm" *ngIf="countries.length > 0">
    <button class="answer-btn" *ngFor="let country of countries" (click)="onAnswerSelect(country)" name="{{ country.code }}">
      <img [src]="imageService.getImageUrl(country.code, 'flags')" alt="{{ country.name }} flag" style="min-width: 50px; min-height: 30px;" class="flag-image">
    </button>
  </div>
</section>
