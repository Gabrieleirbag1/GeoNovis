<div class="end-game">
  <p>Game Over! You completed {{ this.roundsCompleted }} rounds.</p>
  <p>Score: {{ this.score }}/{{ this.roundsCompleted }}</p>
  <!-- <button (click)="gameStateService.resetGame()">Play Again</button> -->
</div>
<div class="results" *ngFor="let result of results.gameState; let i = index">
  <div class="result">
    <p>{{ results['countryInfo'][i].country[language] }}</p>
    <p>{{ results['countryInfo'][i].capital[language] }}</p>
    <p>{{ results['countryInfo'][i].continent[language] }}</p>
    <img [src]="assetsService.getFlagImage(result.code)" alt="{{ results['countryInfo'][i].country[language] }} flag" class="flag-image">
    <img [src]="assetsService.getPlateImage(result.code)" alt="{{ results['countryInfo'][i].country[language] }} plate" class="plate-image">
  </div>
</div>
