<!-- Toggle Button in top-right -->
<button class="sidebar-toggle" (click)="toggleSidebar()">
    <span>☰</span>
</button>

<!-- Sliding Sidebar -->
<div class="sidebar" [class.open]="isSidebarOpen">
    <div class="sidebar-header">
        <h2>GeoNovis</h2>
        <button class="close-sidebar" (click)="toggleSidebar()">×</button>
    </div>
    
    <nav class="sidebar-nav">
        <a routerLink="/">Home</a>
        <a routerLink="/about">About</a>
        <a href="javascript:void(0);" (click)="openQrModal()">QR Code</a>
        
        <div class="language-selector">
            <button class="language-button" [class.active]="currentLanguage === 'fr'" (click)="selectLanguage('fr')">
                <img src="images/flags/fr.svg" alt="French" />
                <span>FR</span>
            </button>
            <button class="language-button" [class.active]="currentLanguage === 'en'" (click)="selectLanguage('en')">
                <img src="images/flags/gb.svg" alt="English" />
                <span>EN</span>
            </button>
        </div>
    </nav>
</div>

<!-- Overlay that appears when sidebar is open -->
<div class="sidebar-overlay" *ngIf="isSidebarOpen" (click)="toggleSidebar()"></div>

<!-- QR Code Modal -->
<div *ngIf="showQrModal" class="qr-modal-overlay">
    <div class="qr-modal">
        <div class="qr-modal-header">
            <h3>Session QR Code</h3>
            <button (click)="closeQrModal()">×</button>
        </div>
        <div class="qr-modal-content">
            <qrcode 
                [qrdata]="strSessionData"
                [width]="256" 
                [errorCorrectionLevel]="'M'">
            </qrcode>
        </div>
        <div class="qr-modal-footer">
            <button class="share-btn" (click)="shareSessionLink()">Share</button>
        </div>
    </div>
</div>
