<div class="modal" id="endround-modal" *ngIf="showModal" (click)="preventModalClose($event)">
  <div class="modal-content">
    <p *ngIf="isCorrect" class="correct">
      {{ language === "fr" ? "Correct!" : "Correct!" }}
    </p>
    <p *ngIf="!isCorrect" class="incorrect">
      {{ language === "fr" ? "Incorrect!" : "Incorrect!" }}
    </p>
    <button (click)="nextTurn()">
      {{ language === "fr" ? "Suivant" : "Next" }}
    </button>
  </div>
</div>
