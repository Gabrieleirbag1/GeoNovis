<VirtualHost *:80>
    ServerAdmin missclick@geonovis
    ServerName geonovis.missclick.net

    DocumentRoot /var/www/GeoNovis/browser

    ErrorLog ${APACHE_LOG_DIR}/missclick-error.log
    CustomLog ${APACHE_LOG_DIR}/missclick-access.log combined

    <Directory /var/www/GeoNovis/browser>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Location "/api">
        ProxyPass "http://localhost:3111/api"
        ProxyPassReverse "http://localhost:3111/api"
    </Location>

RewriteEngine on
RewriteCond %{SERVER_NAME} =geonovis.missclick.net
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
